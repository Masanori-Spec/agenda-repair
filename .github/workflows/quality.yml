name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax and independent oracle checks
        run: npm run check
      - name: Measure bounded solver workloads
        run: npm run benchmark
      - name: Install pinned official browser tooling
        run: npm install --no-save --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser functionality, safety and responsive checks
        run: npm run test:browser
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-repair-evidence
          path: |
            artifacts/
            docs/benchmark-results.json
            docs/browser-results.json
          if-no-files-found: ignore
          retention-days: 7
